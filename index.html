<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Omega Valley: Joseph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<style>
  /* One fixed dark dusk look: the game is a dark pixel world. */
  :root { color-scheme: dark; --bg: #0d0a0c; --panel: #1c1512; --line: #4a3a2c; --fg: #f6e7c8; --muted: #c4b08f;
    --accent: #e9a24c; --on-accent: #1d1206; --font: "Pixelify Sans", "Courier New", monospace; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.5 var(--font); overflow: hidden; }
  #wrap { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; margin: 0 auto;
    top: 50%; transform: translateY(-50%); }
  canvas#game { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
  #menu { background: radial-gradient(ellipse at center, rgba(13,10,12,.55), rgba(13,10,12,.95)); text-align: center; }
  #menu h1 { margin: 0; font-size: clamp(28px, 6vw, 64px); font-weight: 600; letter-spacing: .02em; }
  #menu p { margin: 0; color: var(--muted); max-width: 46ch; padding: 0 16px; }
  .btn { min-height: 48px; min-width: 200px; padding: 0 24px; border-radius: 6px; border: 2px solid var(--accent); background: var(--panel); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  #card { background: #000; cursor: pointer; text-align: center; }
  #card h2 { margin: 0; font-size: clamp(24px, 5vw, 56px); }
  #card p { margin: 0; color: var(--muted); }
  #cut { background: #000; }
  #cut video { width: 100%; height: 100%; object-fit: contain; }
  #skip { position: absolute; right: 2%; bottom: 3%; min-height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--line); background: rgba(0,0,0,.6); }
  #sub { position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%); width: min(86%, 1100px); background: rgba(16,11,9,.86);
    border: 2px solid var(--line); border-radius: 6px; padding: 10px 18px; font-size: clamp(14px, 1.9vw, 26px); pointer-events: none; }
  #sub b { color: var(--accent); margin-right: .5em; }
  #sub .more { display: block; text-align: right; color: var(--muted); font-size: .7em; }
  #toast { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); background: rgba(16,11,9,.86); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 16px; font-size: clamp(13px, 1.6vw, 22px); pointer-events: none; }
  #bar { position: absolute; left: 50%; bottom: 1.5%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; }
  #inv { display: flex; gap: 8px; }
  .slot { width: clamp(40px, 5vw, 64px); height: clamp(40px, 5vw, 64px); border-radius: 6px; border: 2px solid var(--line); background: rgba(16,11,9,.85); padding: 6px; }
  .slot canvas { width: 100%; height: 100%; image-rendering: pixelated; }
  .slot.on { border-color: var(--accent); background: rgba(233,162,76,.25); }
  #nb { min-height: clamp(40px, 5vw, 64px); padding: 0 14px; border-radius: 6px; border: 2px solid var(--line); background: rgba(16,11,9,.85); }
  #panel { background: rgba(8,6,6,.82); }
  .sheet { background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: clamp(12px, 2.5vw, 32px); width: min(92%, 1100px);
    max-height: 92%; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
  .sheet h3 { margin: 0; font-size: clamp(18px, 2.6vw, 34px); color: var(--accent); }
  .sheet p { margin: 0; color: var(--muted); }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
  .choice { min-height: 48px; text-align: left; padding: 10px 14px; border-radius: 6px; border: 2px solid var(--line); background: #241b16; }
  .choice:hover { border-color: var(--accent); }
  .choice.ok { border-color: #7fb069; }
  .choice svg { width: 100%; height: auto; display: block; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  #help { position: absolute; left: 1%; top: 1.5%; color: var(--muted); font-size: clamp(11px, 1.2vw, 16px); pointer-events: none; opacity: .8; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1920" height="1080" aria-label="Game screen. Click to walk; click things to use them."></canvas>
  <div id="help" hidden>Click: walk / use · Right click: drop item · Tab: show everything</div>
  <div id="bar"><div id="inv"></div><button id="nb" hidden>Notebook</button></div>
  <div id="sub" hidden aria-live="polite"><b></b><span></span><i class="more">click to continue</i></div>
  <div id="toast" hidden aria-live="polite"></div>
  <div id="panel" class="overlay" hidden></div>
  <div id="card" class="overlay" hidden><h2></h2><p></p></div>
  <div id="cut" class="overlay" hidden><video id="cutv" playsinline></video><button id="skip">Skip ▸</button></div>
  <div id="menu" class="overlay" hidden>
    <h1>Omega Valley: Joseph</h1>
    <p>The animals of Omega Valley are walking into the mountain on their own. Joseph follows them.</p>
    <button class="btn primary" id="newg">New game</button>
    <button class="btn" id="cont" hidden>Continue</button>
  </div>
</div>
<script src="engine.js"></script>
<script src="game.js"></script>
<script>E.boot(); document.getElementById("help").hidden = false;</script>
</body>
</html>
